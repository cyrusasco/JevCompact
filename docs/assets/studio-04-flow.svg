<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="360" rx="10" fill="#101820"/>
  <text x="24" y="32" fill="#9fd2ff" font-size="14">Step 4 — what happens under the hood of every [Compact] press</text>
  <defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 z" fill="#5bd46a"/></marker></defs>
  <g font-family="Consolas, monospace" font-size="12">
    <!-- pipeline boxes -->
    <rect x="24" y="60" width="150" height="64" rx="8" fill="#1c2733" stroke="#546a80"/>
    <text x="99" y="86" fill="#e8eef4" text-anchor="middle">[Dry run]</text>
    <text x="99" y="106" fill="#8fa3b7" text-anchor="middle" font-size="11">plan only — 0 writes</text>
    <path d="M178 92 H 208" stroke="#5bd46a" stroke-width="3" marker-end="url(#a2)"/>
    <rect x="212" y="60" width="170" height="64" rx="8" fill="#1c2733" stroke="#546a80"/>
    <text x="297" y="86" fill="#e8eef4" text-anchor="middle">[Compact]</text>
    <text x="297" y="106" fill="#8fa3b7" text-anchor="middle" font-size="11">liveness guards first</text>
    <path d="M386 92 H 416" stroke="#5bd46a" stroke-width="3" marker-end="url(#a2)"/>
    <rect x="420" y="60" width="190" height="64" rx="8" fill="#1c2733" stroke="#5bd46a"/>
    <text x="515" y="80" fill="#5bd46a" text-anchor="middle">verified online backup</text>
    <text x="515" y="98" fill="#8fa3b7" text-anchor="middle" font-size="11">pre-jve snapshot of the store</text>
    <text x="515" y="114" fill="#8fa3b7" text-anchor="middle" font-size="11">+ entry in the restore index</text>
    <path d="M614 92 H 644" stroke="#5bd46a" stroke-width="3" marker-end="url(#a2)"/>
    <rect x="648" y="60" width="188" height="64" rx="8" fill="#1c2733" stroke="#5bd46a"/>
    <text x="742" y="86" fill="#5bd46a" text-anchor="middle">rows pruned</text>
    <text x="742" y="106" fill="#8fa3b7" text-anchor="middle" font-size="11">only stale tool traffic</text>
    <!-- guard branch note -->
    <path d="M297 124 V 158" stroke="#ffbd2e" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="212" y="162" width="452" height="52" rx="8" fill="#26200f" stroke="#ffbd2e"/>
    <text x="228" y="184" fill="#ffd97a" font-size="12">if the session is RUNNING or its log flushed &lt; 120 s ago →</text>
    <text x="228" y="204" fill="#ffd97a" font-size="12">BENIGN skip (printed, exit 0). Nothing written. Not an error — wait 2 min and retry.</text>
    <!-- restore arrow back -->
    <path d="M742 124 V 240 H 99 V 130" stroke="#ff8f8f" stroke-width="3" fill="none" marker-end="url(#a2)"/>
    <rect x="24" y="248" width="812" height="72" rx="8" fill="#171f28" stroke="#546a80"/>
    <text x="40" y="272" fill="#ff8f8f" font-size="13">[Restore] walks the whole pipeline backwards — replays the newest verified backup, byte-for-byte.</text>
    <text x="40" y="294" fill="#8fa3b7" font-size="12">Long sessions never fail “history too large”: the host partitions the transcript into windows that each</text>
    <text x="40" y="312" fill="#8fa3b7" font-size="12">fit the classifier budget, then remaps every verdict back onto the global rows. Kept text is byte-identical.</text>
</svg>
